services:
  # YOLO 后端 API
  - type: web
    name: yolo-detection-api
    env: python
    runtime: python-3.11.4
    buildCommand: pip install --upgrade pip && pip install "numpy<2.0.0" && pip install -r requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics

  # Vue 前端
  - type: web
    name: yolo-detection-frontend
    env: node
    buildCommand: cd frontend/vuefront && npm install && npm run build
    startCommand: cd frontend/vuefront && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_URL
        fromService:
          name: yolo-detection-api
          type: web
          property: host
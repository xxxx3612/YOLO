services:
  # YOLO 后端 API
  - type: web
    name: yolo-detection-api
    env: python
    runtime: python-3.11.4
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4

  # Vue 前端
  - type: web
    name: yolo-detection-frontend
    env: node
    buildCommand: cd frontend/vuefront && npm install && npm run build
    startCommand: cd frontend/vuefront && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_URL
        fromService:
          name: yolo-detection-api
          type: web
          property: host